<!-- Get Error Page Status, Status Message, and Error Content From the URL parameters -->
<script>


  // Get the URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const status = urlParams.get('status');
  const message = urlParams.get('message');
  const content = urlParams.get('content');

  // Update the page with the error information
  document.addEventListener('DOMContentLoaded', () => {
    if (status) {
      document.querySelector('.page-error h1').textContent = status;
    }
    if (message) {
      document.querySelector('.page-description').textContent = message;
    }
    if (content) {
      document.querySelector('.error-content').textContent = content;
    }

    //set page title to status and message
    if (status && message) {
      document.title = `Mocktail - Error ${status} - ${message}`;
    } 
  });

</script>
