<!-- Get redirect URL -->
<script>
 
  document.addEventListener("DOMContentLoaded", function () {

    const urlParams = new URLSearchParams(window.location.search);
    const redirectURL = urlParams.get('redirect');
    const errorMessage = urlParams.get('errorMessage');
    const warningMessage = urlParams.get('warningMessage');
    const infoMessage = urlParams.get('infoMessage');


    if (errorMessage) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = errorMessage;
      errorDiv.style.display = 'block';
    }

    if (warningMessage) {
      const warningDiv = document.getElementById('warning-message');
      warningDiv.textContent = warningMessage;
      warningDiv.style.display = 'block';
    }

    if (infoMessage) {
      const infoDiv = document.getElementById('info-message');
      infoDiv.textContent = infoMessage;
      infoDiv.style.display = 'block';
    }

    if (redirectURL) {
      const form = document.querySelector('form');
      const actionUrl = new URL(form.getAttribute('action'), window.location.href);
      const normalizedRedirectURL = redirectURL.replace(/^\/+/, '/');
      actionUrl.searchParams.set('redirect', normalizedRedirectURL);
      form.action = actionUrl.toString();
    }

  })



</script>
